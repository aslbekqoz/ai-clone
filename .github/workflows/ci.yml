name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiclone
          POSTGRES_PASSWORD: aiclone
          POSTGRES_DB: aiclone
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiclone" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://aiclone:aiclone@localhost:5432/aiclone
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Prod'dagi kabi: ilova foydalanuvchisi superuser emas (RDS, Cloud SQL). Kengaytmalarni admin o'rnatadi.
      # Superuser RLS'ni chetlab o'tadi va xatolarni yashiradi — shuning uchun avval shu rejimda.
      - name: Test (superuser bo'lmagan ega)
        env:
          PGPASSWORD: aiclone
        run: |
          psql -h localhost -U aiclone -d aiclone -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE aiclone_owner LOGIN PASSWORD 'owner' CREATEROLE" \
            -c "CREATE DATABASE aiclone_owner OWNER aiclone_owner"
          psql -h localhost -U aiclone -d aiclone_owner -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION vector" -c "CREATE EXTENSION pg_trgm" -c "CREATE EXTENSION pgcrypto"
          TEST_DATABASE_URL=postgres://aiclone_owner:owner@localhost:5432/aiclone_owner pnpm test
      - name: Test (superuser)
        run: pnpm test
      - run: python3 finance/model.py
