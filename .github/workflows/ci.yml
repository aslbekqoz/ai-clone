name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiclone
          POSTGRES_PASSWORD: aiclone
          POSTGRES_DB: aiclone
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiclone" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://aiclone:aiclone@localhost:5432/aiclone
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: python3 finance/model.py
