# Lokal ishlab chiqish: Postgres 16 + pgvector.  docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aiclone
      POSTGRES_PASSWORD: aiclone
      POSTGRES_DB: aiclone
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiclone"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
